<!DOCTYPE html>
<html>
<head>
    <title>Add Todo</title>
</head>

<body>

    <h1>Add Todo</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Title</label>
        <br>
        <input type="text" name="title">
        <br><br>

        <label>Description</label>
        <br>
        <textarea name="description"></textarea>
        <br><br>

        <button type="submit">Add Todo</button>

    </form>

    <br>

    <a href="/">Back to Todo List</a>

</body>
</html>
